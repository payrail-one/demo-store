services:
  store-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: payrail-demo-store:local
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:18082:18082'
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 128m
    cpus: 1
